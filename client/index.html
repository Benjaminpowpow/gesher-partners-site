    <!-- A browser fetches a web font only when text first uses it. Here that
         is after the app's script has loaded and drawn the page, so on a slow
         phone the hero first set in a fallback face and moved when the fonts
         swapped in. Ask for the four Latin faces the page opens with now, in
         parallel with the script. This runs once the stylesheet above has
         loaded, so the faces are known. -->
    <script>
      if (document.fonts && document.fonts.load) {
        ["500 1em Newsreader", "400 1em Newsreader", "400 1em Inter", "600 1em Inter"].forEach(function (f) {
          document.fonts.load(f);
        });
      }
    </script>
